# Categorize the GitHub-generated technical appendix of Stable release notes.
# The human-friendly Russian summary is kept in docs/releases/vX.X.X.X.md.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: "Новые возможности (PR)"
      labels:
        - enhancement
        - feature
    - title: "Исправления (PR)"
      labels:
        - bug
        - fix
    - title: "Технические изменения (PR)"
      labels:
        - "*"
