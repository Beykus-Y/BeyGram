name: Record screenshot goldens

# Rewrites the screenshot goldens (app/src/test/screenshots, see docs/screenshot-tests.md) on a pull request branch.
# It runs only when a maintainer adds the "record-screenshots" label to a pull request from this repository, so an
# intended visual change can be accepted without a local Android build. The label is removed afterwards; the commit
# it pushes is reviewed like any other change in the PR. A push made with the workflow token does not start CI, so
# push any later commit (or re-run "Android release") to verify the new goldens.

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: screenshot-goldens-${{ github.event.pull_request.number }}
  # Queue instead of cancelling: a cancelled run could stop between the commit and the push.
  cancel-in-progress: false

jobs:
  record:
    name: Record goldens
    if: >-
      github.event.label.name == 'record-screenshots' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4
        with:
          # The labeled commit, not whatever the branch points to by the time the job starts.
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: false
          # The build runs PR code; it must not find the write token in .git/config.
          persist-credentials: false

      - name: Checkout BG Media submodule
        env:
          BG_MEDIA_PAT: ${{ secrets.BG_MEDIA_TOKEN }}
        run: |
          if [ -n "$BG_MEDIA_PAT" ]; then
            git config --global url."https://${BG_MEDIA_PAT}@github.com/".insteadOf "https://github.com/"
            git submodule update --init --depth 1 third_party/bg-media
            git config --global --unset-all url."https://${BG_MEDIA_PAT}@github.com/".insteadOf || true
          else
            echo "::warning::No BG_MEDIA token configured. Submodule third_party/bg-media skipped."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle dependency cache
        # Only public plugins and libraries from the Gradle User Home. No Build Cache and no configuration cache are
        # stored: the build embeds secrets.properties values, and a cache saved by a push is readable by PR code.
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
          gradle-home-cache-excludes: caches/build-cache-1

      - name: Install Android platform 36.1
        run: |
          set -uo pipefail
          sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$sdkmanager" ]; then
            echo "::error::sdkmanager not found" >&2
            exit 1
          fi
          yes | "$sdkmanager" --licenses > "$RUNNER_TEMP/licenses.txt" 2>&1 || true
          "$sdkmanager" --install "platforms;android-36.1" > "$RUNNER_TEMP/install.txt" 2>&1

      - name: Record screenshots
        run: |
          printf 'telegramApiId=0\ntelegramApiHash=\n' > secrets.properties
          ./gradlew --no-daemon :app:testDevDebugUnitTest -Pscreenshots=record \
            --tests 'com.beykus.beygram.ui.screenshots.*'

      - name: Save recorded goldens
        # The record step ran code from the PR, which may have left hooks or git settings in this tree. Only the golden
        # files leave it, as an archive, and the commit step unpacks them into a fresh clone.
        run: |
          set -euo pipefail
          if [ -n "$(find app/src/test/screenshots -type l -print -quit)" ]; then
            echo "::error::Symbolic links are not allowed among the screenshot goldens." >&2
            exit 1
          fi
          tar -C app/src/test -cf "$RUNNER_TEMP/goldens.tar" screenshots

      - name: Commit changed goldens
        env:
          # Branch names reach the script only through the environment, never interpolated into it.
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A fresh repository holds only the labeled commit, so nothing the record step wrote to .git runs here.
          work="$RUNNER_TEMP/goldens-commit"
          rm -rf "$work"
          mkdir -p "$work"
          cd "$work"
          git init -q .
          git remote add origin "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "$HEAD_SHA"
          git checkout -q --detach FETCH_HEAD
          rm -rf app/src/test/screenshots
          tar -C app/src/test -xf "$RUNNER_TEMP/goldens.tar"
          git add -A app/src/test/screenshots
          if git diff --cached --quiet; then
            echo "::notice::Goldens unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Record screenshot goldens"
          # Not forced: if the branch moved since the label, the push fails instead of overwriting newer commits.
          git push -q origin "HEAD:refs/heads/${HEAD_REF}"

      - name: Remove the label
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label record-screenshots || true
