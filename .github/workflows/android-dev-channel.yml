name: Android DEV channel

# A push to DEV builds the DEV beta APK and signs it with the release keystore
# (ANDROID_KEYSTORE_* secrets). The key is the same one that signs Stable, as the
# owner decided for this channel. Signing secrets are exposed only to pushes, never to
# pull requests, and never printed. Every build is published as a GitHub prerelease
# tagged dev-<run number>, which never matches the Stable v*.*.*.* tags. The prerelease
# carries the APK and manifest.json, and its notes list the commits since the last DEV build.

on:
  push:
    branches:
      - DEV

permissions:
  contents: read

env:
  # SHA-256 of the signing certificate, the same value as RELEASE_SIGNER_SHA256 in
  # android-release.yml. The DEV APK is refused if it is signed with any other key.
  DEV_SIGNER_SHA256: e7b9e482b2c2feacda9edcef17f960576ed94e94ff8cf7991f89a16e33bf436d

concurrency:
  # One DEV publish at a time, so each changelog starts from the previous published build.
  group: android-dev-channel
  cancel-in-progress: false

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOCKEN || secrets.GH_TOKEN || secrets.BG_MEDIA_TOKEN || github.token }}
          # The build runs code from the branch: the token must not stay in .git/config, where that code could read it.
          persist-credentials: false
          submodules: false

      - name: Checkout BG Media submodule
        env:
          BG_MEDIA_PAT: ${{ secrets.BG_MEDIA_TOKEN }}
        run: |
          if [ -n "$BG_MEDIA_PAT" ]; then
            echo "Configuring submodule authentication for BG Media..."
            git config --global url."https://${BG_MEDIA_PAT}@github.com/".insteadOf "https://github.com/"
            git submodule update --init --depth 1 third_party/bg-media
            git config --global --unset-all url."https://${BG_MEDIA_PAT}@github.com/".insteadOf || true
          else
            echo "::warning::No BG_MEDIA token configured. Submodule third_party/bg-media skipped."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle dependency cache
        # Only public plugins and libraries from the Gradle User Home. No Build Cache and no configuration cache are
        # stored: the build embeds secrets.properties values, and a cache saved by a push is readable by PR code.
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: false
          gradle-home-cache-excludes: caches/build-cache-1

      - name: Install Android platform 36.1
        run: |
          set -uo pipefail
          sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$sdkmanager" ]; then
            echo "::error::sdkmanager not found" >&2
            exit 1
          fi
          yes | "$sdkmanager" --licenses > "$RUNNER_TEMP/licenses.txt" 2>&1 || true
          "$sdkmanager" --install "platforms;android-36.1" > "$RUNNER_TEMP/install.txt" 2>&1

      - name: Write empty Telegram API credentials
        # Unit tests need no keys, so this job never sees the secrets (same as the pull request check).
        run: |
          {
            echo "telegramApiId=0"
            echo "telegramApiHash="
            echo "yandexMusicClientId="
            echo "yandexMusicClientSecret="
          } > secrets.properties

      - name: Run unit tests
        run: ./gradlew --no-daemon :app:testDevDebugUnitTest

      - name: Upload unit test reports
        # A failed run keeps the report, so the exact failing assertion can be read after the job ends.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ github.sha }}
          path: |
            app/build/reports/tests/testDevDebugUnitTest/
            app/build/test-results/testDevDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload screenshot goldens and diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.sha }}
          path: |
            app/src/test/screenshots/
            app/build/outputs/roborazzi/
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build DEV beta (unsigned)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOCKEN || secrets.GH_TOKEN || secrets.BG_MEDIA_TOKEN || github.token }}
          # The build runs code from the branch: the token must not stay in .git/config, where that code could read it.
          persist-credentials: false
          submodules: false

      - name: Checkout BG Media submodule
        env:
          BG_MEDIA_PAT: ${{ secrets.BG_MEDIA_TOKEN }}
        run: |
          if [ -n "$BG_MEDIA_PAT" ]; then
            echo "Configuring submodule authentication for BG Media..."
            git config --global url."https://${BG_MEDIA_PAT}@github.com/".insteadOf "https://github.com/"
            git submodule update --init --depth 1 third_party/bg-media
            git config --global --unset-all url."https://${BG_MEDIA_PAT}@github.com/".insteadOf || true
          else
            echo "::warning::No BG_MEDIA token configured. Submodule third_party/bg-media skipped."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle dependency cache
        # Only public plugins and libraries from the Gradle User Home. No Build Cache and no configuration cache are
        # stored: the build embeds secrets.properties values, and a cache saved by a push is readable by PR code.
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: false
          gradle-home-cache-excludes: caches/build-cache-1

      - name: Install Android platform 36.1
        run: |
          set -uo pipefail
          sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$sdkmanager" ]; then
            echo "::error::sdkmanager not found" >&2
            exit 1
          fi
          yes | "$sdkmanager" --licenses > "$RUNNER_TEMP/licenses.txt" 2>&1 || true
          "$sdkmanager" --install "platforms;android-36.1" > "$RUNNER_TEMP/install.txt" 2>&1

      - name: Write Telegram API credentials
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          # Public OAuth pair for the experimental Yandex Music sign-in (DEV build only). Empty disables it.
          YANDEX_MUSIC_CLIENT_ID: ${{ secrets.YANDEX_MUSIC_CLIENT_ID }}
          YANDEX_MUSIC_CLIENT_SECRET: ${{ secrets.YANDEX_MUSIC_CLIENT_SECRET }}
        run: |
          {
            echo "telegramApiId=${TELEGRAM_API_ID:-0}"
            echo "telegramApiHash=${TELEGRAM_API_HASH:-}"
            echo "yandexMusicClientId=${YANDEX_MUSIC_CLIENT_ID:-}"
            echo "yandexMusicClientSecret=${YANDEX_MUSIC_CLIENT_SECRET:-}"
          } > secrets.properties

      - name: Read the NDK version
        id: ndk
        run: echo "version=$(sed -n 's/.*ndkVersion = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)" >> "$GITHUB_OUTPUT"

      # OpenSSL for the BG Wave adapter is built once per script version, NDK and ABI and shared by DEV and main
      # builds. Only push builds save it; pull requests restore from the DEV or main cache.
      - name: Restore OpenSSL for Android (BG Wave)
        id: openssl-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/beygram-openssl
          key: beygram-openssl-${{ hashFiles('scripts/build-openssl-android.sh') }}-ndk${{ steps.ndk.outputs.version }}-arm64-v8a-${{ runner.os }}

      - name: Build DEV beta (unsigned)
        env:
          BEYGRAM_OPENSSL_CACHE: ${{ runner.temp }}/beygram-openssl
        # The run number is strictly increasing for this workflow, so every DEV build has a newer versionCode.
        # It is the same in every job of a run, including re-runs of a failed job.
        run: ./gradlew --no-daemon -PdevBuildNumber=${{ github.run_number }} :app:assembleDevRelease

      - name: Save OpenSSL for Android (BG Wave)
        if: github.event_name == 'push' && steps.openssl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/beygram-openssl
          key: ${{ steps.openssl-cache.outputs.cache-primary-key }}

      - name: Upload unsigned DEV beta
        uses: actions/upload-artifact@v4
        with:
          name: dev-unsigned-${{ github.sha }}
          path: app/build/outputs/apk/dev/release/*-unsigned.apk
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  publish:
    name: Sign and publish DEV beta
    needs: [unit-tests, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOCKEN || secrets.GH_TOKEN || secrets.BG_MEDIA_TOKEN || github.token }}
          # The build runs code from the branch: the token must not stay in .git/config, where that code could read it.
          persist-credentials: false
          # Full history: the prerelease notes list the commits since the previous DEV build.
          fetch-depth: 0
          submodules: false

      - name: Download unsigned DEV beta
        uses: actions/download-artifact@v4
        with:
          name: dev-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/dev-unsigned

      - name: Check the versionCode of the unsigned build
        run: |
          set -euo pipefail
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          unsigned=$(ls "$RUNNER_TEMP"/dev-unsigned/*-unsigned.apk | head -n 1)
          IFS=. read -r a b c d <<< "$(sed -n 's/^versionName=//p' release-version.properties | head -n 1)"
          expected=$(( a * 100000000 + b * 1000000 + c * 10000 + d + ${{ github.run_number }} ))
          actual=$("$build_tools/aapt" dump badging "$unsigned" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n 1)
          if [ "$actual" != "$expected" ]; then
            echo "::error::versionCode $actual does not match the expected $expected (Stable version + run number); not publishing." >&2
            exit 1
          fi

      - name: Sign and verify DEV beta
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_* secrets are not set; DEV beta is not published." >&2
            exit 1
          fi
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          unsigned=$(ls "$RUNNER_TEMP"/dev-unsigned/*-unsigned.apk | head -n 1)
          out="$RUNNER_TEMP/BeyGram-dev-beta.apk"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          "$build_tools/zipalign" -f -p 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$out" \
            "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" verify --print-certs "$out" > "$RUNNER_TEMP/signer.txt" 2>&1
          digests=$(grep 'certificate SHA-256 digest' "$RUNNER_TEMP/signer.txt" | awk '{print $NF}' | sort -u || true)
          signers=$(printf '%s\n' "$digests" | grep -c . || true)
          if [ "$signers" != "1" ] || [ "$(printf '%s\n' "$digests" | head -n 1)" != "$DEV_SIGNER_SHA256" ]; then
            echo "::error::DEV beta is signed with an unexpected certificate; not publishing." >&2
            exit 1
          fi
          "$build_tools/aapt" dump badging "$out" | head -n 2 | sed 's/^/::notice::/'
          mkdir -p "$RUNNER_TEMP/dev-beta"
          cp "$out" "$RUNNER_TEMP/dev-beta/BeyGram-dev-beta.apk"
          size=$(stat -c %s "$out")
          sha=$(sha256sum "$out" | awk '{print $1}')
          code=$("$build_tools/aapt" dump badging "$out" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n 1)
          test -n "$code"
          printf '{"package":"com.beykus.beygram.dev","versionCode":%s,"sha256":"%s","size":%s,"commit":"%s","signerSha256":"%s"}\n' \
            "$code" "$sha" "$size" "$GITHUB_SHA" "$DEV_SIGNER_SHA256" > "$RUNNER_TEMP/dev-beta/manifest.json"

      - name: Upload DEV beta artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-beta-${{ github.sha }}
          path: ${{ runner.temp }}/dev-beta/
          retention-days: 30
          if-no-files-found: error

      - name: Publish DEV prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="dev-${{ github.run_number }}"
          dir="$RUNNER_TEMP/dev-beta"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A re-run of the same run number may follow a half-finished upload: refresh both files.
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
              "$dir/BeyGram-dev-beta.apk" "$dir/manifest.json"
            echo "::notice::Prerelease $tag already exists; its files were refreshed."
            exit 0
          fi
          previous=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
            --jq '[.[] | select(.tagName | startswith("dev-")) | .tagName] | first // empty')
          notes="$RUNNER_TEMP/dev-notes.md"
          {
            echo "Сборка DEV для проверки. Пакет com.beykus.beygram.dev ставится рядом со Stable."
            echo
            echo "Коммит ${GITHUB_SHA:0:7}."
            echo
            echo "Изменения с прошлой сборки:"
            echo
            prev_sha=""
            if [ -n "$previous" ]; then
              prev_sha=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$previous" --jq .target_commitish)
            fi
            # A force-push to DEV can drop the previous build's commit from history: then list the latest commits.
            if [ -n "$prev_sha" ] && git merge-base --is-ancestor "$prev_sha" "$GITHUB_SHA" 2>/dev/null; then
              git log --no-merges --format='- %s' -n 100 "$prev_sha..$GITHUB_SHA"
            else
              git log --no-merges --format='- %s' -n 30 "$GITHUB_SHA"
            fi
          } > "$notes"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "DEV $tag" --notes-file "$notes" \
            "$dir/BeyGram-dev-beta.apk" "$dir/manifest.json"
