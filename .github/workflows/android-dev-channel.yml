name: Android DEV channel

# A push to DEV builds the DEV beta APK and signs it with the release keystore
# (ANDROID_KEYSTORE_* secrets). The key is the same one that signs Stable, as the
# owner decided for this channel. Signing secrets are exposed only to pushes, never to
# pull requests, and never printed. The signed APK is kept as a workflow artifact with
# a manifest; GitHub prerelease publication is a later step.

on:
  push:
    branches:
      - DEV

permissions:
  contents: read

env:
  # SHA-256 of the signing certificate, the same value as RELEASE_SIGNER_SHA256 in
  # android-release.yml. The DEV APK is refused if it is signed with any other key.
  DEV_SIGNER_SHA256: e7b9e482b2c2feacda9edcef17f960576ed94e94ff8cf7991f89a16e33bf436d

concurrency:
  group: android-dev-channel-${{ github.sha }}
  cancel-in-progress: false

jobs:
  dev-beta:
    name: Build and sign DEV beta
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform 36.1
        run: |
          set -uo pipefail
          sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$sdkmanager" ]; then
            echo "::error::sdkmanager not found" >&2
            exit 1
          fi
          yes | "$sdkmanager" --licenses > "$RUNNER_TEMP/licenses.txt" 2>&1 || true
          "$sdkmanager" --install "platforms;android-36.1" > "$RUNNER_TEMP/install.txt" 2>&1

      - name: Write Telegram API credentials
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          {
            echo "telegramApiId=${TELEGRAM_API_ID:-0}"
            echo "telegramApiHash=${TELEGRAM_API_HASH:-}"
          } > secrets.properties

      - name: Run unit tests
        run: ./gradlew --no-daemon :app:testDevDebugUnitTest

      - name: Build DEV beta (unsigned)
        # The run number is strictly increasing for this workflow, so every DEV build has a newer versionCode.
        run: ./gradlew --no-daemon -PdevVersionCode=${{ github.run_number }} :app:assembleDevRelease

      - name: Sign and verify DEV beta
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_* secrets are not set; DEV beta is not published." >&2
            exit 1
          fi
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          unsigned=$(ls app/build/outputs/apk/dev/release/*-unsigned.apk | head -n 1)
          out="$RUNNER_TEMP/BeyGram-dev-beta.apk"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          "$build_tools/zipalign" -f -p 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$out" \
            "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" verify --print-certs "$out" > "$RUNNER_TEMP/signer.txt" 2>&1
          digests=$(grep 'certificate SHA-256 digest' "$RUNNER_TEMP/signer.txt" | awk '{print $NF}' | sort -u || true)
          signers=$(printf '%s\n' "$digests" | grep -c . || true)
          if [ "$signers" != "1" ] || [ "$(printf '%s\n' "$digests" | head -n 1)" != "$DEV_SIGNER_SHA256" ]; then
            echo "::error::DEV beta is signed with an unexpected certificate; not publishing." >&2
            exit 1
          fi
          "$build_tools/aapt" dump badging "$out" | head -n 2 | sed 's/^/::notice::/'
          mkdir -p "$RUNNER_TEMP/dev-beta"
          cp "$out" "$RUNNER_TEMP/dev-beta/BeyGram-dev-beta.apk"
          size=$(stat -c %s "$out")
          sha=$(sha256sum "$out" | awk '{print $1}')
          code=$(printf '%s' "${{ github.run_number }}")
          printf '{"package":"com.beykus.beygram.dev","versionCode":%s,"sha256":"%s","size":%s,"commit":"%s","signerSha256":"%s"}\n' \
            "$code" "$sha" "$size" "$GITHUB_SHA" "$DEV_SIGNER_SHA256" > "$RUNNER_TEMP/dev-beta/manifest.json"

      - name: Upload DEV beta artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-beta-${{ github.sha }}
          path: ${{ runner.temp }}/dev-beta/
          retention-days: 30
          if-no-files-found: error
