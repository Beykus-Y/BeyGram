name: Android release

# Flow:
# 1. A push to main builds the APKs once and stores the signed prod release APK
#    as a workflow artifact named after the commit.
# 2. Publishing (a v*.*.*.* tag, or a manual run with publish: true) does not build
#    anything. It takes the artifact of the successful main build of the same commit,
#    checks its signature and attaches it to the GitHub release.
# Without a main build of that commit, publishing fails.

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*.*"
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, four numeric parts, e.g. 0.0.0.1. Used only when publish is true."
        required: true
        default: "0.0.0.1"
        type: string
      publish:
        description: "Publish the signed APK from the main build of the selected commit"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  # SHA-256 of the release signing certificate, from apksigner's "certificate SHA-256 digest"
  # line for the v0.0.0.2 release APK. Publishing refuses any other key.
  # Rotating the keystore means updating this value in a reviewed PR.
  RELEASE_SIGNER_SHA256: e7b9e482b2c2feacda9edcef17f960576ed94e94ff8cf7991f89a16e33bf436d

concurrency:
  # Keyed by event, ref and commit: a pending run in a shared group is replaced by a newer
  # one, so unrelated pushes or a tag and a manual publish of one commit must not share it.
  group: android-release-${{ github.event_name }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Build APKs
    # Tags never build: publishing reuses the main build of the tagged commit.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && !inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Test release notes validator
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Require changelog when a PR changes the Stable version
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git diff --quiet "$BASE_SHA" HEAD -- release-version.properties; then
            echo '::notice::Stable version unchanged; no new release changelog required.'
          else
            python3 scripts/release_notes.py validate
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform 36.1
        # The runner image ships the Android SDK but not sdkmanager on PATH.
        # Command output is echoed as notice annotations so failures are readable.
        run: |
          set -uo pipefail
          sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n 1)
          echo "::notice::sdkmanager=${sdkmanager:-missing}"
          if [ -z "$sdkmanager" ]; then
            find "$ANDROID_HOME" -maxdepth 2 | sed 's/^/::notice::/' | head -40
            exit 1
          fi
          yes | "$sdkmanager" --licenses > "$RUNNER_TEMP/licenses.txt" 2>&1 || true
          "$sdkmanager" --install "platforms;android-36.1" > "$RUNNER_TEMP/install.txt" 2>&1
          code=$?
          sed 's/^/::notice::/' "$RUNNER_TEMP/install.txt" | tail -40
          exit $code

      - name: Write Telegram API credentials
        # Required for pushes and manual runs. Without these secrets their Dev and Prod APK
        # builds stop (see checkTelegramCredentials in app/build.gradle.kts).
        env:
          # Pull requests build with empty credentials, as before, so their workflow
          # code cannot read these secrets.
          TELEGRAM_API_ID: ${{ github.event_name != 'pull_request' && secrets.TELEGRAM_API_ID || '' }}
          TELEGRAM_API_HASH: ${{ github.event_name != 'pull_request' && secrets.TELEGRAM_API_HASH || '' }}
        run: |
          {
            echo "telegramApiId=${TELEGRAM_API_ID:-0}"
            echo "telegramApiHash=${TELEGRAM_API_HASH:-}"
          } > secrets.properties

      - name: Run unit tests
        # JVM tests of the dev debug variant. They run before the APKs are built, so a failing test fails this job,
        # and a failed main build cannot be published.
        run: ./gradlew --no-daemon :app:testDevDebugUnitTest

      - name: Upload unit test reports
        # A failed run keeps the report, so the exact failing assertion can be read after the job ends.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ github.sha }}
          path: |
            app/build/reports/tests/testDevDebugUnitTest/
            app/build/test-results/testDevDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Build debug, release and instrumented-test APKs (no device tests)
        run: ./gradlew --no-daemon :app:assembleDevDebug :app:assembleProdRelease :app:assembleDevDebugAndroidTest

      - name: Assert install permission is Prod-only
        run: |
          set -euo pipefail
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          dev=app/build/outputs/apk/dev/debug/app-dev-debug.apk
          prod=app/build/outputs/apk/prod/release/app-prod-release-unsigned.apk
          "$build_tools/aapt" dump permissions "$dev" > "$RUNNER_TEMP/dev-permissions.txt"
          "$build_tools/aapt" dump permissions "$prod" > "$RUNNER_TEMP/prod-permissions.txt"
          if grep -q "android.permission.REQUEST_INSTALL_PACKAGES" "$RUNNER_TEMP/dev-permissions.txt"; then
            echo "::error::DEV unexpectedly requests APK installation permission" >&2
            exit 1
          fi
          if ! grep -q "android.permission.REQUEST_INSTALL_PACKAGES" "$RUNNER_TEMP/prod-permissions.txt"; then
            echo "::error::Prod APK is missing manual update installation permission" >&2
            exit 1
          fi

      - name: Collect and sign APKs
        env:
          # Signing secrets are only exposed to pushes, not to pull requests, which
          # run workflow code from the branch under review.
          KEYSTORE_BASE64: ${{ github.event_name == 'push' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          KEYSTORE_PASSWORD: ${{ github.event_name == 'push' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ github.event_name == 'push' && secrets.ANDROID_KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ github.event_name == 'push' && secrets.ANDROID_KEY_PASSWORD || '' }}
          # Only the main build feeds releases, so it must be signed.
          REQUIRE_SIGNING: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/apks"
          mkdir -p "$out/dev-debug" "$out/prod-release"
          # The dev debug APK is signed with the runner's debug key. It is kept as
          # a workflow artifact only and is never published.
          cp app/build/outputs/apk/dev/debug/app-dev-debug.apk "$out/dev-debug/BeyGram-dev-debug.apk"

          release_in=app/build/outputs/apk/prod/release/app-prod-release-unsigned.apk
          release_out="$out/prod-release/BeyGram-prod-release.apk"
          if [ -n "$KEYSTORE_BASE64" ]; then
            build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            "$build_tools/zipalign" -f -p 4 "$release_in" "$RUNNER_TEMP/aligned.apk"
            "$build_tools/apksigner" sign \
              --ks "$RUNNER_TEMP/release.keystore" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --key-pass env:KEY_PASSWORD \
              --out "$release_out" \
              "$RUNNER_TEMP/aligned.apk"
            # Report the signer so the signature can be checked from the check run, and
            # fail here if the key is not the pinned release key, not only at publish time.
            "$build_tools/apksigner" verify --print-certs "$release_out" > "$RUNNER_TEMP/signer.txt" 2>&1
            sed 's/^/::notice::/' "$RUNNER_TEMP/signer.txt"
            # apksigner prints the digest per scheme (v2, v3) with a wording that varies by version,
            # so count distinct digests: exactly one, and it must be the pinned key.
            digests=$(grep 'certificate SHA-256 digest' "$RUNNER_TEMP/signer.txt" | awk '{print $NF}' | sort -u || true)
            signers=$(printf '%s\n' "$digests" | grep -c . || true)
            digest=$(printf '%s\n' "$digests" | head -n 1)
            if [ "$signers" != "1" ] || [ "$digest" != "$RELEASE_SIGNER_SHA256" ]; then
              echo "::error::Main build is signed with digest '${digest:-none}', not the pinned release key. If the keystore was rotated, update RELEASE_SIGNER_SHA256 in a reviewed PR." >&2
              exit 1
            fi
          elif [ "$REQUIRE_SIGNING" = "true" ]; then
            echo "::error::Refusing to store an unsigned main release APK. Set the ANDROID_KEYSTORE_* secrets." >&2
            exit 1
          else
            cp "$release_in" "$release_out"
            echo "::notice::Release APK is unsigned; it is not publishable."
          fi
          echo "APKs prepared in $out:"
          find "$out" -name '*.apk' -exec ls -l {} + | sed 's/^/::notice::/'

      - name: Upload prod release APK
        uses: actions/upload-artifact@v4
        with:
          name: beygram-prod-release-${{ github.sha }}
          path: ${{ runner.temp }}/apks/prod-release/BeyGram-prod-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload dev debug APK
        uses: actions/upload-artifact@v4
        with:
          name: beygram-dev-debug-${{ github.sha }}
          path: ${{ runner.temp }}/apks/dev-debug/BeyGram-dev-debug.apk
          if-no-files-found: error
          retention-days: 90

  manual-publish-from-branch:
    # Manual publishing is refused outside main, so the run fails instead of passing silently.
    name: Refuse manual publish outside main
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Refuse
        run: |
          echo "::error::Manual publishing runs only from main. Run the workflow from main with publish set to true." >&2
          exit 1

  publish:
    name: Publish GitHub release
    # Manual publishing runs only from main, so the workflow file it runs is the reviewed one.
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    # Leaves room for the wait for a main build still running on this commit.
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out release configuration
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            version="${REF_NAME#v}"
          else
            version="$INPUT_VERSION"
          fi
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){3}$ ]]; then
            echo "Version must have four numeric parts, got: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate Stable changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/release_notes.py validate --version "$VERSION"

      - name: Find the successful main build of this commit
        id: run
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # gh api sends POST when fields are given, so the method is explicit.
          runs_url="repos/$GITHUB_REPOSITORY/actions/workflows/android-release.yml/runs"
          run_id=""
          # Wait up to about 45 minutes while a main build of this commit is queued or running.
          for attempt in $(seq 1 90); do
            # A failed request is retried at the next check instead of ending the step.
            if ! runs=$(gh api --method GET "$runs_url" -f head_sha="$SHA" -f per_page=50 \
              --jq '[.workflow_runs[] | select(.event == "push" and .head_branch == "main")]'); then
              echo "::warning::Could not list the workflow runs for ${SHA::7}; retrying (check $attempt)."
              sleep 30
              continue
            fi
            run_id=$(echo "$runs" | jq -r 'map(select(.conclusion == "success")) | .[0].id // empty')
            if [ -n "$run_id" ]; then
              break
            fi
            pending=$(echo "$runs" | jq 'map(select(.status != "completed")) | length')
            total=$(echo "$runs" | jq 'length')
            # Give a just-pushed main build about five minutes to appear before giving up.
            if [ "$pending" = "0" ] && { [ "$total" != "0" ] || [ "$attempt" -ge 10 ]; }; then
              break
            fi
            echo "::notice::The main build of ${SHA::7} is still running; waiting (check $attempt)."
            sleep 30
          done
          if [ -z "$run_id" ]; then
            echo "::error::No successful build on main for commit ${SHA::7}. If the main build failed, fix it and merge the commit to main again. If it has not run yet, run this workflow manually with publish set to true from main once that build passes." >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "::notice::Using main build run $run_id for commit ${SHA::7}"

      - name: Download the prod release APK
        env:
          RUN_ID: ${{ steps.run.outputs.run_id }}
          ARTIFACT: beygram-prod-release-${{ github.sha }}
        run: |
          set -euo pipefail
          if ! gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT" --dir apks; then
            echo "::error::Artifact $ARTIFACT is missing or expired. Artifacts are kept up to 90 days, and a repository retention setting can make that shorter. Merge the commit to main again to rebuild it." >&2
            exit 1
          fi

      - name: Verify signature and name the release APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          apk=apks/BeyGram-prod-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::Expected $apk in the artifact." >&2
            exit 1
          fi
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          if ! "$build_tools/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/signer.txt" 2>&1; then
            sed 's/^/::error::/' "$RUNNER_TEMP/signer.txt"
            echo "::error::Refusing to publish an APK that does not verify. Set the ANDROID_KEYSTORE_* secrets and merge to main again." >&2
            exit 1
          fi
          sed 's/^/::notice::/' "$RUNNER_TEMP/signer.txt"
          # Only the pinned release key is accepted: exactly one signer, with the expected digest.
          digests=$(grep 'certificate SHA-256 digest' "$RUNNER_TEMP/signer.txt" | awk '{print $NF}' | sort -u || true)
          signers=$(printf '%s\n' "$digests" | grep -c . || true)
          digest=$(printf '%s\n' "$digests" | head -n 1)
          if [ "$signers" != "1" ] || [ "$digest" != "$RELEASE_SIGNER_SHA256" ]; then
            echo "::error::APK signer digest '${digest:-none}' ($signers signer(s)) is not the pinned release key. Refusing to publish." >&2
            exit 1
          fi
          mv "$apk" "apks/BeyGram-$VERSION-prod-release.apk"

      - name: Validate embedded APK version and generate update manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          apk="apks/BeyGram-$VERSION-prod-release.apk"
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          badging=$("$build_tools/aapt" dump badging "$apk")
          package_line=$(printf '%s\n' "$badging" | grep '^package: ' | head -n 1)
          package_name=$(printf '%s\n' "$package_line" | awk -F "'" '{print $2}')
          apk_code=$(printf '%s\n' "$package_line" | awk -F "'" '{print $4}')
          apk_version=$(printf '%s\n' "$package_line" | awk -F "'" '{print $6}')
          if [ "$package_name" != "com.beykus.beygram" ] || [ "$apk_version" != "$VERSION" ] || ! [[ "$apk_code" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Tag v$VERSION does not match the APK: package=$package_name versionCode=$apk_code versionName=$apk_version" >&2
            exit 1
          fi
          # Ensure the integer code follows the same 4-part encoding as Gradle.
          IFS=. read -r major minor patch revision <<< "$VERSION"
          expected_code=$((10#$major * 100000000 + 10#$minor * 1000000 + 10#$patch * 10000 + 10#$revision))
          if [ "$apk_code" != "$expected_code" ]; then
            echo "::error::Expected embedded versionCode=$expected_code but APK contains $apk_code." >&2
            exit 1
          fi
          digest=$(sha256sum "$apk" | cut -d ' ' -f 1)
          size=$(stat -c '%s' "$apk")
          jq -n --arg name "BeyGram-$VERSION-prod-release.apk" \
                --arg version "$apk_version" --arg sha "$digest" \
                --argjson code "$apk_code" --argjson bytes "$size" \
                '{schema: 1, versionName: $version, versionCode: $code, apkName: $name, size: $bytes, sha256: $sha}' \
                > apks/BeyGram-stable-update.json
          jq -e . apks/BeyGram-stable-update.json > /dev/null



      - name: Prepare user and technical release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          output="$RUNNER_TEMP/beygram-release-notes.md"
          cp "docs/releases/v${VERSION}.md" "$output"
          # Best-effort GitHub-generated PR list. Human-authored notes remain canonical.
          # Generate this from the same commit whose tested APK will be published.
          generated="$RUNNER_TEMP/technical-release-notes.md"
          if ! gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" \
              -f configuration_file_path='.github/release.yml' --jq .body > "$generated"; then
            echo '::warning::GitHub could not generate technical release notes; using commit link.'
            : > "$generated"
          fi
          {
            printf '\n\n<!-- TECHNICAL_CHANGELOG -->\n\n---\n\n## Для разработчиков\n\n'
            if [ -s "$generated" ]; then
              cat "$generated"
            else
              printf 'Технические изменения: https://github.com/%s/commits/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            fi
          } >> "$output"
          echo "::notice::Prepared release notes for $tag"

      - name: Create or update release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          apk_name="BeyGram-$VERSION-prod-release.apk"
          notes_file="$RUNNER_TEMP/beygram-release-notes.md"
          # A pre-existing tag must resolve to the exact commit whose signed APK was checked.
          tag_err="$RUNNER_TEMP/tag.err"
          if tag_sha=$(gh api --method GET "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha 2>"$tag_err"); then
            :
          elif grep -qE 'HTTP (404|422)' "$tag_err"; then
            tag_sha=""
          else
            cat "$tag_err" >&2
            echo "::error::Cannot verify tag $tag; refusing to publish." >&2
            exit 1
          fi
          if [ -n "$tag_sha" ] && [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $tag points to ${tag_sha:0:7}, not ${GITHUB_SHA:0:7}; refusing to publish." >&2
            exit 1
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
            if [ "$draft" != 'true' ]; then
              # Published releases are immutable from this workflow, even on retries.
              assets=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets)
              if ! printf '%s\n' "$assets" | jq -e --arg apk "$apk_name" \
                  '([.assets[].name] | index($apk) != null) and ([.assets[].name] | index("BeyGram-stable-update.json") != null)' >/dev/null; then
                echo "::error::Already published $tag is missing required files. Refusing to mutate it." >&2
                exit 1
              fi
              echo "::notice::Release $tag is already published; leaving its notes and assets unchanged."
              exit 0
            fi
            # Retry a partial failure only while the release is still a Draft.
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "BeyGram $VERSION" --notes-file "$notes_file"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "BeyGram $VERSION" \
              --notes-file "$notes_file" --draft
          fi

          gh release upload "$tag" \
            "apks/$apk_name" "apks/BeyGram-stable-update.json" \
            --repo "$GITHUB_REPOSITORY" --clobber
          assets=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets)
          if ! printf '%s\n' "$assets" | jq -e --arg apk "$apk_name" \
              '([.assets[].name] | index($apk) != null) and ([.assets[].name] | index("BeyGram-stable-update.json") != null)' >/dev/null; then
            echo "::error::Draft release is missing required assets; it remains unpublished." >&2
            exit 1
          fi
          # Only now make the release visible to the app's /releases/latest updater.
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false

