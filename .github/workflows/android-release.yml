name: Android release

on:
  push:
    tags:
      - "v*.*.*.*"
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, four numeric parts, e.g. 0.0.0.1"
        required: true
        default: "0.0.0.1"
        type: string
      publish:
        description: "Create or update the GitHub release with the APKs"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            version="${REF_NAME#v}"
            publish="true"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            # Build check only. 0.0.0.0 is not a release version.
            version="0.0.0.0"
            publish="false"
          else
            version="$INPUT_VERSION"
            publish="$INPUT_PUBLISH"
          fi
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){3}$ ]]; then
            echo "Version must have four numeric parts, got: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform 36.1
        # The runner image ships the Android SDK with accepted licenses.
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --install "platforms;android-36.1"

      - name: Write Telegram API credentials
        # Optional. Without these secrets the APKs are built with empty credentials
        # and TDLib cannot sign in.
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          {
            echo "telegramApiId=${TELEGRAM_API_ID:-0}"
            echo "telegramApiHash=${TELEGRAM_API_HASH:-}"
          } > secrets.properties

      - name: Build debug and release APKs
        run: ./gradlew --no-daemon :app:assembleDevDebug :app:assembleProdRelease

      - name: Collect and sign APKs
        id: apks
        env:
          VERSION: ${{ steps.version.outputs.version }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/apks"
          mkdir -p "$out"
          cp app/build/outputs/apk/dev/debug/app-dev-debug.apk "$out/BeyGram-$VERSION-dev-debug.apk"

          release_in=app/build/outputs/apk/prod/release/app-prod-release-unsigned.apk
          release_out="$out/BeyGram-$VERSION-prod-release.apk"
          if [ -n "$KEYSTORE_BASE64" ]; then
            build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            "$build_tools/zipalign" -f -p 4 "$release_in" "$RUNNER_TEMP/aligned.apk"
            "$build_tools/apksigner" sign \
              --ks "$RUNNER_TEMP/release.keystore" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --key-pass env:KEY_PASSWORD \
              --out "$release_out" \
              "$RUNNER_TEMP/aligned.apk"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            cp "$release_in" "$release_out"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "APKs prepared in $out:"
          ls -l "$out"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: beygram-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/apks/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: beygram-${{ needs.build.outputs.version }}
          path: apks

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "BeyGram $VERSION" \
              --notes "Android APKs built from ${GITHUB_SHA::7}."
          fi
          gh release upload "$tag" apks/*.apk --repo "$GITHUB_REPOSITORY" --clobber
